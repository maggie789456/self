<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>待回品展示 - 麦杞岐对接服务站</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    color: #333;
}
header {
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
    color: #fff;
    padding: 30px 20px;
    text-align: center;
    border-bottom: 3px solid #ff6a00;
}
header h1 { font-size: 28px; margin: 0 0 8px; font-weight: 700; }
header .subtitle { font-size: 14px; color: #ccc; }
.notice {
    background: #fff3e0;
    border: 1px solid #ff6a00;
    border-radius: 8px;
    padding: 12px 20px;
    margin: 15px auto;
    max-width: 1400px;
    font-size: 14px;
    color: #e65100;
    display: flex;
    align-items: center;
    gap: 8px;
}
.notice .icon { font-size: 20px; }
.disclaimer {
    background: #fff;
    border-left: 3px solid #ff6a00;
    padding: 8px 16px;
    margin: 10px auto;
    max-width: 1400px;
    font-size: 12px;
    color: #999;
}
.tabs {
    display: flex;
    gap: 12px;
    max-width: 1400px;
    margin: 0 auto 20px;
}
.tab {
    flex: 1;
    padding: 14px 24px;
    text-align: center;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    transition: all 0.2s;
    border: 2px solid #e0e0e0;
    background: #fff;
    color: #333;
}
.tab.active { background: #ff6a00; color: #fff; border-color: #ff6a00; }
.tab:hover:not(.active) { border-color: #ff6a00; color: #ff6a00; }
.panel { display: none; max-width: 1400px; margin: 0 auto; }
.panel.show { display: block; }
.current-filter {
    background: #fff;
    border-radius: 8px;
    padding: 10px 16px;
    margin-bottom: 12px;
    font-size: 13px;
    color: #666;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
}
.current-filter .chip {
    background: #fff3e0;
    color: #e65100;
    border: 1px solid #ff6a00;
    border-radius: 14px;
    padding: 2px 10px;
    font-size: 12px;
    cursor: pointer;
}
.current-filter .chip:hover { background: #ff6a00; color: #fff; }
.current-filter .clear { color: #ff6a00; cursor: pointer; font-weight: 600; }
.section-title {
    font-size: 22px;
    font-weight: bold;
    color: #1a1a1a;
    padding: 14px 20px;
    background: linear-gradient(90deg, #fff3e0, transparent);
    border-left: 4px solid #ff6a00;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.section-title .badge {
    background: #ff6a00;
    color: #fff;
    font-size: 12px;
    padding: 2px 10px;
    border-radius: 10px;
}
.sub-heading {
    font-size: 16px;
    font-weight: 600;
    color: #555;
    padding: 8px 4px;
    margin: 12px 0 8px;
    border-bottom: 2px solid #ff6a00;
    display: inline-block;
}
.grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 15px;
    margin-bottom: 30px;
}
@media (max-width: 1200px) { .grid { grid-template-columns: repeat(4,1fr); } }
@media (max-width: 900px)  { .grid { grid-template-columns: repeat(3,1fr); } }
@media (max-width: 600px)  { .grid { grid-template-columns: repeat(2,1fr); } }
.card {
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    transition: transform 0.3s, box-shadow 0.3s;
    cursor: pointer;
}
.card:hover { transform: translateY(-4px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
.card .img-wrap {
    width: 100%;
    aspect-ratio: 3/4;
    overflow: hidden;
    background: #f0f0f0;
    position: relative;
}
.card .img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s;
}
.card:hover .img-wrap img { transform: scale(1.05); }
.card .img-wrap .no-img {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ccc;
    font-size: 12px;
    text-align: center;
    padding: 10px;
}
.card .img-wrap .zoom {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: rgba(0,0,0,0.7);
    color: #ff6a00;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.3s;
}
.card:hover .img-wrap .zoom { opacity: 1; }
.card .info { padding: 10px; font-size: 12px; }
.card .info .label { color: #999; font-size: 11px; margin-bottom: 2px; }
.card .info .value { color: #333; margin-bottom: 6px; word-break: break-all; display: flex; align-items: center; gap: 4px; }
.card .info .copy-btn {
    background: #ff6a00;
    color: #fff;
    border: none;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 10px;
    cursor: pointer;
    flex-shrink: 0;
}
.card .info .copy-btn:hover { background: #e55a00; }
.card .info .time-value { color: #ff6a00; font-weight: 500; }
.loading { text-align: center; color: #999; padding: 60px 0; font-size: 14px; }
.empty { text-align: center; color: #999; padding: 60px 0; font-size: 14px; }
.footer {
    text-align: center;
    padding: 30px 20px;
    color: #999;
    font-size: 12px;
    border-top: 1px solid #e0e0e0;
    margin-top: 30px;
}
/* 弹窗 */
.modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.modal.show { display: flex; }
.modal-content {
    background: #1a1a1a;
    border-radius: 12px;
    max-width: 90%;
    max-height: 90vh;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
}
.modal-img-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    overflow: hidden;
    padding: 10px;
}
.modal-img-wrap img {
    max-width: 100%;
    max-height: 70vh;
    object-fit: contain;
    border-radius: 6px;
}
.modal-info {
    padding: 14px 18px;
    background: #1a1a1a;
    color: #ccc;
    font-size: 13px;
    line-height: 1.9;
    border-top: 1px solid #333;
}
.modal-info .row { display: flex; align-items: center; gap: 6px; }
.modal-info b { color: #ff6a00; }
.modal-info a.search-link {
    color: #ff6a00;
    text-decoration: none;
    font-weight: 600;
}
.modal-info a.search-link:hover { text-decoration: underline; }
.modal-close {
    position: absolute;
    top: 10px; right: 14px;
    color: #fff;
    font-size: 26px;
    cursor: pointer;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
    width: 36px; height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
}
.modal-close:hover { background: rgba(255,106,0,0.8); }
.modal-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: #fff;
    font-size: 32px;
    cursor: pointer;
    background: rgba(255,255,255,0.12);
    border-radius: 50%;
    width: 46px; height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    z-index: 10;
}
.modal-nav:hover { background: rgba(255,106,0,0.85); }
.modal-nav.prev { left: 12px; }
.modal-nav.next { right: 12px; }
.modal-count { color: #999; font-size: 11px; }
</style>
</head>
<body>

<header>
    <h1>待回品展示</h1>
    <div class="subtitle">全球国家 · 外套夹克 · 衬衫 · 麦杞岐对接服务站</div>
</header>

<div class="notice">
    <span class="icon">📌</span>
    <span>以下为按类目整理的待回品明细，点击商品卡片可查看大图并复制款式编号。</span>
</div>

<div class="disclaimer">
    ⚠️ 本页商品图片及信息来源于业务数据，仅供内部参考使用，请勿用于任何商业用途或对外传播。
</div>

<div class="tabs" id="tabs">
    <div class="tab active" data-tab="jacket">🧥 外套夹克</div>
    <div class="tab" data-tab="shirt">👔 衬衫</div>
</div>

<div class="panel show" id="panel-jacket">
    <div class="current-filter">
        展示：
        <span class="chip" data-cat="外套夹克">外套夹克</span>
        <span class="clear" onclick="resetFilter()">清除筛选</span>
    </div>
    <div id="jacket-content"><div class="loading">正在加载数据...</div></div>
</div>

<div class="panel" id="panel-shirt">
    <div class="current-filter">
        展示：
        <span class="chip" data-cat="衬衫">衬衫</span>
        <span class="clear" onclick="resetFilter()">清除筛选</span>
    </div>
    <div id="shirt-content"><div class="loading">正在加载数据...</div></div>
</div>

<div class="footer">
    数据更新：请用最新待回品文件替换 data/market_demand.json · 仅供参考
</div>

<!-- 大图弹窗 -->
<div class="modal" id="modal">
    <div class="modal-content">
        <div class="modal-close" onclick="closeModal()">×</div>
        <div class="modal-nav prev" onclick="navModal(-1)">‹</div>
        <div class="modal-nav next" onclick="navModal(1)">›</div>
        <div class="modal-img-wrap" id="modal-img-wrap"></div>
        <div class="modal-info" id="modal-info"></div>
    </div>
</div>

<script>
let allData = [];
let currentIdx = -1;

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function copyText(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent;
        btn.textContent = '已复制✓';
        setTimeout(() => { btn.textContent = orig; }, 1200);
    });
}

async function loadData() {
    try {
        const resp = await fetch('data/market_demand.json');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        allData = await resp.json();
        renderPanel('jacket-content', '外套夹克');
        renderPanel('shirt-content', '衬衫');
    } catch(e) {
        document.getElementById('jacket-content').innerHTML =
            '<div class="empty">数据加载失败，请确保 data/market_demand.json 文件存在</div>';
        document.getElementById('shirt-content').innerHTML =
            '<div class="empty">数据加载失败，请确保 data/market_demand.json 文件存在</div>';
    }
}

function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(function(t) {
        t.classList.toggle('active', t.dataset.tab === tab);
    });
    document.getElementById('panel-jacket').classList.toggle('show', tab === 'jacket');
    document.getElementById('panel-shirt').classList.toggle('show', tab === 'shirt');
    if (tab === 'jacket') resetFilter();
}

function resetFilter() {
    document.querySelectorAll('.chip').forEach(function(c) { c.classList.remove('dimmed'); });
}

function renderPanel(containerId, categoryKey) {
    var container = document.getElementById(containerId);
    var panelData = allData.filter(function(d) { return d.category === categoryKey; });

    if (panelData.length === 0) {
        container.innerHTML = '<div class="empty">暂无' + categoryKey + '数据</div>';
        return;
    }

    // 按叶子类目分组
    var groups = {};
    panelData.forEach(function(item) {
        var key = item.leafCategory || '未分类';
        if (!groups[key]) groups[key] = [];
        groups[key].push(item);
    });
    var leafKeys = Object.keys(groups).sort(function(a,b){ return a.localeCompare(b, 'zh'); });

    var html = '';
    leafKeys.forEach(function(leaf) {
        var items = groups[leaf];
        html += '<div class="section-title">' + escapeHtml(leaf) +
                ' <span class="badge">' + items.length + '款</span></div>';
        html += '<div class="grid">';
        items.forEach(function(item) {
            var idx = allData.indexOf(item);
            var firstImg = (item.images && item.images.length > 0) ? item.images[0] : '';
            var hasImg = !!firstImg;
            html += '<div class="card" onclick="openModal(' + idx + ')">';
            html += '<div class="img-wrap">';
            if (hasImg) {
                html += '<img src="' + escapeHtml(firstImg) + '" alt="商品图片" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentElement.innerHTML=\'<div class=\\\'no-img\\\'>图片加载失败</div>\'">';
                html += '<div class="zoom">🔍</div>';
            } else {
                html += '<div class="no-img">暂无图片<br>点击查看链接</div>';
            }
            html += '</div>';
            html += '<div class="info">';
            html += '<div class="label">类目路径</div>';
            html += '<div class="value">' + escapeHtml(item.leafCategory || '-') + '</div>';
            html += '<div class="label">款式编号</div>';
            html += '<div class="value"><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escapeHtml(item.industryId || '-') + '</span>';
            if (item.industryId) {
                html += '<button class="copy-btn" onclick="event.stopPropagation();copyText(\'' + escapeHtml(item.industryId) + '\',this)">复制</button>';
            }
            html += '</div>';
            html += '<div class="label">区域</div>';
            html += '<div class="value">' + escapeHtml(regionText(item.region)) + '</div>';
            html += '<div class="label">更新时间</div>';
            html += '<div class="value time-value">' + escapeHtml(item.updateTime || '-') + '</div>';
            html += '</div>';
            html += '</div>';
        });
        html += '</div>';
    });

    container.innerHTML = html;
}

function regionText(r) {
    if (!r) return '-';
    var map = { '欧区': '🇪🇺 欧区', '美区': '🇺🇸 美区', '拉美': '🌎 拉美' };
    return map[r] || r;
}

function openModal(idx) {
    currentIdx = idx;
    showModal();
}

function showModal() {
    var item = allData[currentIdx];
    if (!item) return;
    var imgWrap = document.getElementById('modal-img-wrap');
    var info = document.getElementById('modal-info');

    if (item.images && item.images.length > 0) {
        var img = document.createElement('img');
        img.src = item.images[0];
        img.referrerPolicy = 'no-referrer';
        img.alt = '商品大图';
        imgWrap.innerHTML = '';
        imgWrap.appendChild(img);
    } else {
        imgWrap.innerHTML = '<div style="color:#666;padding:60px;">暂无图片</div>';
    }

    var infoHtml = '<div><b>类目路径：</b>' + escapeHtml(item.leafCategory || '-') + '</div>';
    infoHtml += '<div class="row"><b>款式编号：</b>' + escapeHtml(item.industryId || '-');
    if (item.industryId) {
        infoHtml += ' <button class="copy-btn" onclick="copyText(\'' + escapeHtml(item.industryId) + '\',this)">复制编号</button>';
    }
    infoHtml += '</div>';
    infoHtml += '<div><b>区域：</b>' + escapeHtml(regionText(item.region)) + '</div>';
    infoHtml += '<div><b>更新时间：</b>' + escapeHtml(item.updateTime || '-') + '</div>';
    if (item.link) {
        infoHtml += '<div><a href="' + escapeHtml(item.link) + '" target="_blank" class="search-link">🔗 查看商品链接</a></div>';
    }
    infoHtml += '<div class="modal-count">' + (currentIdx + 1) + ' / ' + allData.length + '</div>';

    info.innerHTML = infoHtml;
    document.getElementById('modal').classList.add('show');
}

function closeModal() {
    document.getElementById('modal').classList.remove('show');
}

function navModal(dir) {
    currentIdx += dir;
    if (currentIdx < 0) currentIdx = allData.length - 1;
    if (currentIdx >= allData.length) currentIdx = 0;
    showModal();
}

document.getElementById('tabs').addEventListener('click', function(e) {
    if (e.target.classList.contains('tab')) {
        switchTab(e.target.dataset.tab);
    }
});
document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target.id === 'modal') closeModal();
});
document.addEventListener('keydown', function(e) {
    if (!document.getElementById('modal').classList.contains('show')) return;
    if (e.key === 'Escape') closeModal();
    if (e.key === 'ArrowLeft') navModal(-1);
    if (e.key === 'ArrowRight') navModal(1);
});

loadData();
</script>
</body>
</html>
