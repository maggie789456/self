.tab.on .tcnt{background:rgba(255,255,255,.24);color:#fff;}

const CATS = D.cats, REGIONS = D.regions, PATHS = D.paths, IMGS = D.imgs, ITEMS = D.items;
const TRISET = new Set(D.tri);
const GOODS = 'https://www.temu.com/goods.html?goods_id=';
const REG_CLS = {'欧区':'e','全球':'g','美区':'u','未标注':'n'};
const REG_ICON = {'欧区':'🇪🇺','全球':'🌍','美区':'🇺🇸','未标注':'❓'};
const CAT_ICON = {'夹克外套':'🧣'};
const PLACEHOLDER = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="360" height="480"><rect width="360" height="480" fill="#eef0f3"/>' +
  '<text x="180" y="238" font-size="19" fill="#9aa3af" text-anchor="middle" font-family="sans-serif">暂无首图</text></svg>')));

const objs = ITEMS.map((r,i)=>({
  i:i, cat:CATS[r[0]], region:REGIONS[r[1]], leaf:PATHS[r[2]][0], path:PATHS[r[2]][1],
  img:r[3]>=0?IMGS[r[3]]:'', gid:r[4], url:GOODS+r[4], tri:TRISET.has(r[4])
}));
const allUrls = objs.map(o=>o.img||PLACEHOLDER);
const allJumps = objs.map(o=>o.url);

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uniqN(list){return new Set(list.map(x=>x.gid)).size;}

const SECTIONS = [];
const triObjs = objs.filter(o=>o.tri);
const hotGroups = CATS.map(c=>({label:c, cls:'s-'+c, icon:CAT_ICON[c], items:triObjs.filter(o=>o.cat===c)}))
                     .filter(g=>g.items.length);
SECTIONS.push({key:'hot', label:'大爆款潜力商品（三区）', cls:'hot', kind:'hot',
  total:triObjs.length, uniq:new Set(triObjs.map(o=>o.gid)).size, groups:hotGroups});
const REG_BG = {
  '欧区':'linear-gradient(115deg,#1d4ed8,#3b82f6 60%,#60a5fa)',
  '全球':'linear-gradient(115deg,#047857,#10b981 60%,#34d399)',
  '美区':'linear-gradient(115deg,#6d28d9,#8b5cf6 60%,#a78bfa)'
};
REGIONS.forEach(rg=>{
  const list = objs.filter(o=>o.region===rg);
  if(!list.length) return;
  SECTIONS.push({key:rg, label:rg, cls:'rg', kind:'region', region:rg,
    total:list.length, uniq:uniqN(list), items:list,
    groups:[{label:list[0].leaf, cls:'s-hot', icon:REG_ICON[rg], items:list}]});
});

function card(o, badge){
  const src = o.img || PLACEHOLDER;
  return `<div class="card">
    <div class="thumb" onclick="lbOpen(${o.i})">
      <img loading="lazy" decoding="async" src="${esc(src)}" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src=PLACEHOLDER;">
      <div class="bdg">${esc(badge)}</div>
      <div class="zoomhint">🔍 点击放大查看原图</div>
    </div>
    <div class="acts">
      <a class="btn jump" href="${esc(o.url)}" target="_blank" rel="noopener">跳转商品页</a>
      <button class="btn cpath" data-path="${esc(o.path)}" onclick="cpPath(this)">复制类目路径</button>
    </div>
  </div>`;
}

/* 叶子类目卡片：顶部为突出的【类目路径复制板块】 */
function leafBlock(list){
  const leaf = list[0].leaf, path = list[0].path || '';
  return `<div class="leaf">
    <div class="leafhead">
      <div class="bigname"><span class="dot"></span>${esc(leaf)}</div>
      <div class="counter">${list.length} 条 · ${uniqN(list)} 款</div>
    </div>
    <div class="pathbar">
      <span class="lb2">📂 类目路径</span>
      <div class="pathwrap">
        <span class="ptxt" title="${esc(path)}">${esc(path||'—')}</span>
        <button class="pcopy" data-path="${esc(path)}" onclick="cpPath(this)">📋 复制类目路径</button>
      </div>
    </div>
    <div class="grid">${list.map(o=>card(o, o.region)).join('')}</div>
  </div>`;
}

function subHeader(g, countText){
  return `<div class="subhd ${g.cls}">
    <span>${g.icon || '📁'}</span><span>${esc(g.label)}</span>
    <span class="n">${countText}</span></div>`;
}

function renderSection(sec, si){
  if(sec.kind==='hot'){
    const head = `<div class="banner b-hot">
      <div class="ico">🔥</div>
      <div><h2>大爆款潜力商品（三区）</h2><div class="desc">在「欧区 + 全球 + 美区」三个区域均有销售记录的同款商品</div></div>
      <div class="cnt"><b>${sec.uniq}</b><span>款（共 ${sec.total} 条记录）</span></div></div>`;
    const body = sec.groups.map((g,gi)=>{
      const gidOrder = [...new Set(g.items.map(o=>o.gid))];
      const cards = gidOrder.map(gid=>{
        const list = g.items.filter(o=>o.gid===gid);
        return card(list[0], [...new Set(list.map(x=>x.region))].join('/'));
      }).join('');

      return `<div id="sub-${si}-${gi}">
        ${subHeader(g, `${gidOrder.length} 款商品 · ${g.items.length} 条记录`)}
        <div class="leaf" style="padding-top:12px">
          <div class="grid">${cards}</div>
        </div></div>`;
    }).join('');
    return `<section id="sec-${si}" class="sec">${head}${body}</section>`;
  }
  if(sec.kind==='region'){
    const head = `<div class="banner" style="background:${REG_BG[sec.region]||'linear-gradient(115deg,#334155,#64748b)'}">
      <div class="ico">${REG_ICON[sec.region]||'📍'}</div>
      <div><h2>${esc(sec.region)}</h2><div class="desc">推荐类目统一为「男士棉质轻型夹克」 · 类目路径一键复制</div></div>
      <div class="cnt"><b>${sec.uniq}</b><span>款（共 ${sec.total} 条记录）</span></div></div>`;
    return `<section id="sec-${si}" class="sec">${head}${leafBlock(sec.items)}</section>`;
  }
  const body = sec.groups.map((g,gi)=>{
    const groups = new Map();
    g.items.forEach(o=>{ const k=o.path||o.leaf; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(o); });
    const gs=[...groups.entries()].sort((a,b)=>b[1].length-a[1].length);
    const heads = `<div class="region-hd">
        <span class="tag">${esc(g.label)}</span>
        <span class="pill ${REG_CLS[g.label]||'n'}">${g.items.length} 条 · ${uniqN(g.items)} 款</span>
        <span style="font-size:12px;color:#6b7280">共 ${gs.length} 个叶子类目</span>
      </div>`;
    return `<div id="sub-${si}-${gi}">${heads}${gs.map(x=>leafBlock(x[1])).join('')}</div>`;
  }).join('');
  return `<section id="sec-${si}" class="sec">
    <div class="banner b-${esc(sec.cat)}">
      <div class="ico">${CAT_ICON[sec.cat]}</div>
      <div><h2>${esc(sec.cat)}</h2><div class="desc">推荐类目统一为「男士棉质轻型夹克」 · 按区域分区 · 类目路径一键复制</div></div>
      <div class="cnt"><b>${sec.total}</b><span>条记录 / ${sec.uniq} 款商品</span></div>
    </div>${body}</section>`;
}

document.getElementById('app').innerHTML = SECTIONS.map(renderSection).join('');
document.getElementById('f-total').textContent = objs.length;

const tabsEl = document.getElementById('tabs');
const sideTitle = document.getElementById('side-title');
const sideEl = document.getElementById('sidenav');
let activeSec = 0;

tabsEl.innerHTML = SECTIONS.map((s,i)=>{
  const n = s.uniq + '款';
  const icon = s.kind==='hot' ? '🔥 ' : (REG_ICON[s.region]||'') + ' ';
  return `<button class="tab ${s.kind==='hot'?'hot':''}" data-i="${i}">${icon}${esc(s.label)}<span class="tcnt">${n}</span></button>`;
}).join('');
tabsEl.addEventListener('click', e=>{
  const b = e.target.closest('.tab'); if(!b) return;
  const i = +b.dataset.i;
  setActive(i);
  document.getElementById('sec-'+i).scrollIntoView({block:'start'});
});

function setActive(i){
  activeSec = i;
  [...tabsEl.children].forEach((b,k)=>b.classList.toggle('on', k===i));
  buildSide(i);
}
function buildSide(i){
  const sec = SECTIONS[i];
  sideTitle.textContent = (sec.kind==='hot' ? '大爆品潜力商品 · 按类目' : sec.region + ' · 叶子类目');
  sideEl.innerHTML = sec.groups.map((g,gi)=>{
    const n = sec.kind==='hot' ? new Set(g.items.map(o=>o.gid)).size : g.items.length;
    const unit = sec.kind==='hot' ? '款' : '条';
    const icon = g.icon || (sec.kind==='hot' ? '' : (REG_ICON[g.label]||'📍'));
    return `<button data-sub="sub-${i}-${gi}" data-g="${gi}">
      <span>${icon} ${esc(g.label)}</span><span class="n">${n}${unit}</span></button>`;
  }).join('');
  sideEl.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{
      document.getElementById(b.dataset.sub).scrollIntoView({block:'start'});
      markSub(b.dataset.g);
    };
  });
  markSub('0');
}
function markSub(gi){ sideEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.g===String(gi))); }

let ticking=false;
window.addEventListener('scroll', ()=>{
  if(ticking) return; ticking=true;
  requestAnimationFrame(()=>{
    const topH = 80 + 26;
    let cur=0;
    SECTIONS.forEach((s,i)=>{ const el=document.getElementById('sec-'+i);
      if(el && el.getBoundingClientRect().top <= topH) cur=i; });
    if(cur!==activeSec) setActive(cur);
    const sec=SECTIONS[activeSec];
    let curG=0;
    sec.groups.forEach((g,gi)=>{ const el=document.getElementById('sub-'+activeSec+'-'+gi);
      if(el && el.getBoundingClientRect().top <= topH+10) curG=gi; });
    markSub(curG);
    ticking=false;
  });
}, {passive:true});
setActive(0);

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1600);}
function cp(text,msg){
  const done=()=>toast(msg||'已复制');
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(done).catch(()=>fb(text,done));}
  else fb(text,done);
}
function fb(text,done){
  const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');done();}catch(e){toast('复制失败，请手动选择');}
  document.body.removeChild(ta);
}
function cpPath(el){
  cp(el.dataset.path||'', '✅ 已复制类目路径');
  const orig = el.dataset.orig || (el.dataset.orig = el.innerHTML);
  el.classList.add('done');
  el.innerHTML = '✅ 已复制';
  clearTimeout(el._h);
  el._h = setTimeout(()=>{ el.classList.remove('done'); el.innerHTML = orig; }, 1500);
}

let lbIdx=0;
function lbOpen(i){ lbIdx=i; lbRender(); document.getElementById('lb').classList.add('on'); }
function lbRender(){
  const box=document.getElementById('lbimg');
  box.onerror=function(){this.onerror=null;this.src=PLACEHOLDER;};
  box.src=allUrls[lbIdx]||PLACEHOLDER;
  document.getElementById('lbcap').innerHTML =
    `<a class="btn primary" href="${esc(allJumps[lbIdx])}" target="_blank" rel="noopener">跳转商品页</a>
     <div style="color:#9ca3af;font-size:12px;margin-top:9px">第 ${lbIdx+1} / ${allUrls.length} 张 · ← → 切换 · Esc 关闭</div>`;
}
function lbStep(d){lbIdx=(lbIdx+d+allUrls.length)%allUrls.length;lbRender();}
function lbClose(){document.getElementById('lb').classList.remove('on');}
document.getElementById('lb').addEventListener('click',e=>{if(e.target.id==='lb')lbClose();});
document.addEventListener('keydown',e=>{
  if(!document.getElementById('lb').classList.contains('on'))return;
  if(e.key==='Escape')lbClose();
  if(e.key==='ArrowLeft')lbStep(-1);
  if(e.key==='ArrowRight')lbStep(1);
});
</script>
</body>
</html>
